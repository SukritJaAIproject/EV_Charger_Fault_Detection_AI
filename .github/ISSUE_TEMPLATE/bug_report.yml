name: Bug report / แจ้งปัญหา
description: Something in the iMPS Fault Detection app or the research code does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying the app. Thai or English are both fine. / ขอบคุณที่ช่วยทดลองใช้ เขียนเป็นภาษาไทยหรืออังกฤษก็ได้

        **Please do not attach captures or logs with sensitive data.** Charging captures can contain vehicle identifiers (EVCCID, MAC addresses), station names and locations, and this issue is public. Describe the capture instead, or ask here for a private way to share it.
        **กรุณาอย่าแนบไฟล์ PCAP หรือ log ที่มีข้อมูลอ่อนไหว** เพราะ issue นี้เป็นสาธารณะ
  - type: dropdown
    id: edition
    attributes:
      label: Edition / รุ่นของโปรแกรม
      options:
        - iMPS Fault Detection (current line, blue icon)
        - iMPS Fault Detection Snapshot 2026-09-12 (amber icon)
        - iMPS Fault Detection ISO 15118 (green icon)
        - Built from source / research code
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / เวอร์ชัน
      description: Shown in the dashboard header, e.g. "iMPS Fault Detection v1.7.0". / ดูได้จากหัวหน้าจอ dashboard
      placeholder: "1.7.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / เวอร์ชัน Windows
      placeholder: "Windows 11 Pro 24H2"
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen? / เกิดที่ส่วนไหน
      options:
        - Installing or uninstalling / การติดตั้ง
        - Starting the app / การเปิดโปรแกรม
        - Analyze PCAP / วิเคราะห์ PCAP
        - Overview and benchmark / ภาพรวม
        - Stations, Station Health / ผลรายสถานี
        - Dataset & Retrain
        - Ground Truth Label
        - Train Model
        - Research code (ev_charger_ai)
        - Other / อื่น ๆ
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / เกิดอะไรขึ้น
      description: Include any error message you saw. / ใส่ข้อความ error ที่เห็นด้วย
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / ขั้นตอนที่ทำให้เกิดปัญหา
      placeholder: |
        1. Open the app
        2. Select Analyze PCAP
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? / ผลที่คาดว่าจะได้
  - type: textarea
    id: capture
    attributes:
      label: About the capture (if a PCAP is involved) / ข้อมูลไฟล์ PCAP
      description: Size, charger model or protocol (DIN 70121 / ISO 15118-2), and roughly what happened in the session. Do not upload the file here. / ขนาดไฟล์ รุ่นตู้ชาร์จ โปรโตคอล และเหตุการณ์ในการชาร์จ (ไม่ต้องอัปโหลดไฟล์)
  - type: textarea
    id: logs
    attributes:
      label: Log / บันทึกการทำงาน
      description: The last 50 lines of %APPDATA%\<product name>\logs\desktop-runtime.log. Remove anything sensitive first. / 50 บรรทัดสุดท้ายของไฟล์ log (ลบข้อมูลอ่อนไหวออกก่อน)
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / ความเป็นส่วนตัว
      options:
        - label: I did not attach captures or logs with vehicle identifiers, station names or locations. / ฉันไม่ได้แนบข้อมูลที่ระบุตัวรถ ชื่อสถานี หรือที่ตั้ง
          required: true
