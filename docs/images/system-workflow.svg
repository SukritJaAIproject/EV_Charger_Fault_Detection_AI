<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1118" viewBox="0 0 960 1118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How iMPS Fault Detection works</title>
<desc id="d">Lane A, on your PC: pick a .pcap, it is uploaded only to the local engine on 127.0.0.1, decoded by the bundled TShark and dsV2Gshark, split into sessions and checked by the Agentic AI detector; the verdict (fault, no fault or inconclusive) appears on screen. Lane B, optional and monthly: import captures, label ground truth and train a candidate model inside the app; held-out validation, manual approval and a new release happen outside the app, and only a new release changes the model that Agentic AI uses.</desc>
<defs><marker id="aNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><marker id="aViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker></defs>
<rect x="1" y="1" width="958" height="1116" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="40" y="58" font-size="30" fill="#0f172a" font-weight="700">How iMPS Fault Detection works</text>
<text x="40" y="92" font-size="18" fill="#475569" font-family="'Segoe UI', 'Leelawadee UI', 'Leelawadee', Tahoma, 'Helvetica Neue', Arial, sans-serif">ภาพรวมการทำงาน: วิเคราะห์ไฟล์ PCAP บนเครื่องของคุณ และฝึกโมเดลใหม่รายเดือน (ไม่บังคับ)</text>
<circle cx="781" cy="52" r="13" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<g fill="#6d28d9"><circle cx="781" cy="48" r="4.8"/><path d="M772.5,62.5 a8.5,8.5 0 0 1 17,0 z"/></g>
<text x="800" y="58" font-size="16" fill="#334155">Done by a person</text>
<rect x="36" y="132" width="888" height="660" rx="18" fill="#f2fbf7" stroke="#059669" stroke-width="2.5"/>
<rect x="56" y="116" width="319" height="32" rx="16" fill="#059669"/>
<g fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="70" y="123" width="18" height="12" rx="2"/><path d="M79,135 V139 M74,140 H84"/></g>
<text x="96" y="138" font-size="17" fill="#ffffff" font-weight="700">iMPS Fault Detection on your PC</text>
<rect x="580" y="116" width="324" height="32" rx="16" fill="#e7f8f0" stroke="#059669" stroke-width="2"/>
<path d="M601,123 L608,126 V131 C608,136 604.5,139 601,140 C597.5,139 594,136 594,131 V126 Z" fill="#059669"/>
<path d="M597.8,131.6 L600.3,134 L604.4,129.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="618" y="138" font-size="16" fill="#047857" font-weight="700">Data stays on this PC · works offline</text>
<rect x="56" y="169" width="28" height="28" rx="7" fill="#f5b800"/>
<text x="70" y="189" font-size="17" fill="#0f172a" font-weight="700" text-anchor="middle">A</text>
<text x="96" y="190" font-size="21" fill="#0f172a" font-weight="700">Analyze a capture</text>
<text x="284" y="190" font-size="16" fill="#475569">from a .pcap file to the verdict; nothing leaves this PC</text>
<rect x="56" y="216" width="256" height="128" rx="12" fill="#fff8e1" stroke="#f5b800" stroke-width="2"/>
<circle cx="82" cy="216" r="14" fill="#f5b800" stroke="#ffffff" stroke-width="3"/>
<text x="82" y="221.5" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">1</text>
<text x="184" y="258" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Pick a capture</text>
<text x="184" y="286" font-size="17" fill="#334155" text-anchor="middle">.pcap or .pcapng up to</text>
<text x="184" y="308" font-size="17" fill="#334155" text-anchor="middle">256 MiB; drag and drop it in</text>
<rect x="352" y="216" width="256" height="128" rx="12" fill="#fff8e1" stroke="#f5b800" stroke-width="2"/>
<circle cx="378" cy="216" r="14" fill="#f5b800" stroke="#ffffff" stroke-width="3"/>
<text x="378" y="221.5" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">2</text>
<text x="480" y="258" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Local upload</text>
<text x="480" y="286" font-size="17" fill="#334155" text-anchor="middle">sent only to the engine on</text>
<text x="480" y="308" font-size="17" fill="#334155" text-anchor="middle">127.0.0.1; the per-launch</text>
<text x="480" y="330" font-size="17" fill="#334155" text-anchor="middle">token is checked</text>
<rect x="648" y="216" width="256" height="128" rx="12" fill="#fff8e1" stroke="#f5b800" stroke-width="2"/>
<circle cx="674" cy="216" r="14" fill="#f5b800" stroke="#ffffff" stroke-width="3"/>
<text x="674" y="221.5" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">3</text>
<text x="776" y="258" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Decode packets</text>
<text x="776" y="286" font-size="17" fill="#334155" text-anchor="middle">bundled TShark and</text>
<text x="776" y="308" font-size="17" fill="#334155" text-anchor="middle">dsV2Gshark read the V2G,</text>
<text x="776" y="330" font-size="17" fill="#334155" text-anchor="middle">SLAC and TCP events</text>
<rect x="56" y="394" width="256" height="128" rx="12" fill="#fff8e1" stroke="#f5b800" stroke-width="2"/>
<circle cx="82" cy="394" r="14" fill="#f5b800" stroke="#ffffff" stroke-width="3"/>
<text x="82" y="399.5" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">4</text>
<text x="184" y="436" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Split sessions</text>
<text x="184" y="464" font-size="17" fill="#334155" text-anchor="middle">at a 60 s idle gap, or at a new</text>
<text x="184" y="486" font-size="17" fill="#334155" text-anchor="middle">handshake after SessionStop</text>
<rect x="352" y="394" width="256" height="128" rx="12" fill="#fff8e1" stroke="#f5b800" stroke-width="2"/>
<circle cx="378" cy="394" r="14" fill="#f5b800" stroke="#ffffff" stroke-width="3"/>
<text x="378" y="399.5" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">5</text>
<text x="480" y="436" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Agentic AI</text>
<text x="480" y="464" font-size="17" fill="#334155" text-anchor="middle">fault rules plus LSTM-AE</text>
<text x="480" y="486" font-size="17" fill="#334155" text-anchor="middle">and GRU evidence; first</text>
<text x="480" y="508" font-size="17" fill="#334155" text-anchor="middle">alert per session</text>
<rect x="648" y="394" width="256" height="128" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
<circle cx="674" cy="394" r="14" fill="#f5b800" stroke="#ffffff" stroke-width="3"/>
<text x="674" y="399.5" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">6</text>
<text x="776" y="436" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">Verdict on screen</text>
<circle cx="700" cy="458" r="6" fill="#ef4444"/>
<text x="716" y="464" font-size="17" fill="#ffffff" font-weight="700">Fault detected</text>
<circle cx="700" cy="480" r="6" fill="#10b981"/>
<text x="716" y="486" font-size="17" fill="#ffffff" font-weight="700">No fault detected</text>
<circle cx="700" cy="502" r="6" fill="#f5b800"/>
<text x="716" y="508" font-size="17" fill="#ffffff" font-weight="700">Inconclusive</text>
<path d="M314,280 H349" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#aNavy)"/>
<path d="M610,280 H645" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#aNavy)"/>
<path d="M314,458 H349" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#aNavy)"/>
<path d="M610,458 H645" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#aNavy)"/>
<path d="M776,346 V369 H184 V377" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#aNavy)"/>
<rect x="56" y="591" width="28" height="28" rx="7" fill="#6d28d9"/>
<text x="70" y="611" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">B</text>
<text x="96" y="612" font-size="21" fill="#0f172a" font-weight="700">Monthly retraining (optional)</text>
<text x="402" y="612" font-size="16" fill="#475569">a person starts it; it never swaps the model by itself</text>
<rect x="36" y="816" width="888" height="236" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="904" y="848" font-size="17" fill="#334155" font-weight="700" text-anchor="end">Outside the app: release process run by people</text>
<rect x="56" y="638" width="256" height="128" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<circle cx="82" cy="638" r="14" fill="#6d28d9" stroke="#ffffff" stroke-width="3"/>
<text x="82" y="643.5" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="184" y="680" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Import captures</text>
<text x="184" y="708" font-size="17" fill="#334155" text-anchor="middle">a month of PCAPs from a</text>
<text x="184" y="730" font-size="17" fill="#334155" text-anchor="middle">ZIP or folder,</text>
<text x="184" y="752" font-size="17" fill="#334155" text-anchor="middle">de-duplicated by SHA-256</text>
<rect x="352" y="638" width="256" height="128" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<circle cx="378" cy="638" r="14" fill="#6d28d9" stroke="#ffffff" stroke-width="3"/>
<text x="378" y="643.5" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<circle cx="582" cy="638" r="15" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<g fill="#6d28d9"><circle cx="582" cy="634" r="4.8"/><path d="M573.5,648.5 a8.5,8.5 0 0 1 17,0 z"/></g>
<text x="480" y="680" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Ground-truth labels</text>
<text x="480" y="708" font-size="17" fill="#334155" text-anchor="middle">a reviewer marks</text>
<text x="480" y="730" font-size="17" fill="#334155" text-anchor="middle">each capture Normal,</text>
<text x="480" y="752" font-size="17" fill="#334155" text-anchor="middle">Fault or Exclude</text>
<rect x="648" y="638" width="256" height="128" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<circle cx="674" cy="638" r="14" fill="#6d28d9" stroke="#ffffff" stroke-width="3"/>
<text x="674" y="643.5" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="776" y="680" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Train candidate</text>
<text x="776" y="708" font-size="17" fill="#334155" text-anchor="middle">fine-tunes LSTM-AE + GRU</text>
<text x="776" y="730" font-size="17" fill="#334155" text-anchor="middle">on a separate PyTorch install;</text>
<text x="776" y="752" font-size="17" fill="#334155" text-anchor="middle">saves a candidate only</text>
<rect x="56" y="870" width="256" height="128" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<circle cx="82" cy="870" r="14" fill="#6d28d9" stroke="#ffffff" stroke-width="3"/>
<text x="82" y="875.5" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<circle cx="286" cy="870" r="15" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<g fill="#6d28d9"><circle cx="286" cy="866" r="4.8"/><path d="M277.5,880.5 a8.5,8.5 0 0 1 17,0 z"/></g>
<text x="184" y="912" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Held-out validation</text>
<text x="184" y="940" font-size="17" fill="#334155" text-anchor="middle">protected test data;</text>
<text x="184" y="962" font-size="17" fill="#334155" text-anchor="middle">recall, false-alarm and</text>
<text x="184" y="984" font-size="17" fill="#334155" text-anchor="middle">latency thresholds</text>
<rect x="352" y="870" width="256" height="128" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<circle cx="378" cy="870" r="14" fill="#6d28d9" stroke="#ffffff" stroke-width="3"/>
<text x="378" y="875.5" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<circle cx="582" cy="870" r="15" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<g fill="#6d28d9"><circle cx="582" cy="866" r="4.8"/><path d="M573.5,880.5 a8.5,8.5 0 0 1 17,0 z"/></g>
<text x="480" y="912" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Manual approval</text>
<text x="480" y="940" font-size="17" fill="#334155" text-anchor="middle">a person signs off and</text>
<text x="480" y="962" font-size="17" fill="#334155" text-anchor="middle">the approval is recorded</text>
<rect x="648" y="870" width="256" height="128" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<circle cx="674" cy="870" r="14" fill="#6d28d9" stroke="#ffffff" stroke-width="3"/>
<text x="674" y="875.5" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<circle cx="878" cy="870" r="15" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
<g fill="#6d28d9"><circle cx="878" cy="866" r="4.8"/><path d="M869.5,880.5 a8.5,8.5 0 0 1 17,0 z"/></g>
<text x="776" y="912" font-size="19" fill="#0f172a" font-weight="700" text-anchor="middle">Release</text>
<text x="776" y="940" font-size="17" fill="#334155" text-anchor="middle">new build and installer with</text>
<text x="776" y="962" font-size="17" fill="#334155" text-anchor="middle">the approved model; previous</text>
<text x="776" y="984" font-size="17" fill="#334155" text-anchor="middle">model kept for rollback</text>
<path d="M314,702 H349" fill="none" stroke="#6d28d9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#aViolet)"/>
<path d="M610,702 H645" fill="none" stroke="#6d28d9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#aViolet)"/>
<path d="M314,934 H349" fill="none" stroke="#6d28d9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#aViolet)"/>
<path d="M610,934 H645" fill="none" stroke="#6d28d9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#aViolet)"/>
<path d="M776,768 V804 H184 V853" fill="none" stroke="#6d28d9" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#aViolet)"/>
<circle cx="67" cy="1026" r="9" fill="none" stroke="#475569" stroke-width="1.8"/><path d="M63,1022 L71,1030 M71,1022 L63,1030" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
<text x="86" y="1032" font-size="16" fill="#475569">Fails a check or is not approved: the candidate is discarded and the current model stays.</text>
<path d="M906,934 H942 V560 H480 V539" fill="none" stroke="#6d28d9" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#aViolet)"/>
<rect x="557" y="546" width="328" height="28" rx="14" fill="#f2fbf7"/>
<text x="721" y="565.44" font-size="16" fill="#6d28d9" font-weight="700" text-anchor="middle">approved model, only via a new release</text>
<path d="M480,1054 V1084 H18 V702 H53" fill="none" stroke="#6d28d9" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#aViolet)"/>
<rect x="71.5" y="1070" width="395" height="28" rx="14" fill="#ffffff"/>
<text x="269" y="1089.44" font-size="16" fill="#6d28d9" font-weight="700" text-anchor="middle">next month: import the new captures and repeat</text>
</svg>